<meta name="theme-color" content="#5B0BA8">
<style>
:root {
  --pu:#5B0BA8; --dp:#3B076B; --go:#FFC83D; --lav:#E8D8FF; --ww:#FCFAFF; --ink:#241A2B;
  --bg:#F6F0FC; --surface:#FFFFFF; --muted:#6B5F75; --line:#D9C8EE; --accent:#5B0BA8; --on-accent:#FFFFFF; --soft:#F1E8FB;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#150F1D; --surface:#21172E; --ink:#F3ECFB; --muted:#B5A7C4; --line:#3A2B4F; --accent:#C9A6FF; --on-accent:#1A0E2A; --soft:#2B1E3D; --lav:#3A2757; --dp:#E4D2FF; --pu:#C9A6FF; --ww:#21172E; }
}
:root[data-theme="dark"] { --bg:#150F1D; --surface:#21172E; --ink:#F3ECFB; --muted:#B5A7C4; --line:#3A2B4F; --accent:#C9A6FF; --on-accent:#1A0E2A; --soft:#2B1E3D; --lav:#3A2757; --dp:#E4D2FF; --pu:#C9A6FF; --ww:#21172E; }
html { scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:16px; line-height:1.45; padding-bottom:84px; -webkit-text-size-adjust:100%; }
header { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:3px solid var(--go); padding:12px 16px; }
header { display:flex; align-items:center; gap:12px; }
header .logo { flex:none; height:50px; width:auto; }
header .kicker { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; }
header h1 { margin:2px 0 0; font-size:21px; font-weight:800; color:var(--dp); }
main { max-width:640px; margin:0 auto; padding:16px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
.card h2 { margin:0 0 6px; font-size:17px; color:var(--dp); }
.card h3 { margin:14px 0 6px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.sub { color:var(--muted); font-size:14px; margin:0 0 10px; }
label.f { display:block; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:14px 0 4px; }
input[type=text],input[type=tel],input[type=date],textarea { width:100%; font:inherit; color:var(--ink); background:var(--ww); border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; }
textarea { min-height:78px; resize:vertical; }
input:focus,textarea:focus,button:focus-visible,summary:focus-visible { outline:3px solid var(--go); outline-offset:1px; }
.row { display:flex; gap:8px; align-items:center; }
.row > * { flex:1; }
button { font:inherit; cursor:pointer; }
.btn { background:var(--accent); color:var(--on-accent); border:0; border-radius:12px; padding:12px 16px; font-weight:700; width:100%; }
.btn.ghost { background:transparent; color:var(--accent); border:1.5px solid var(--accent); }
.btn.small { width:auto; padding:8px 12px; font-size:14px; }
.btn.danger { background:transparent; color:#B3261E; border:1.5px solid #B3261E; }
.check { display:flex; align-items:center; gap:12px; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px; margin-bottom:8px; background:var(--ww); }
.check input { width:22px; height:22px; accent-color:var(--accent); flex:none; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { border:1.5px solid var(--line); background:var(--ww); color:var(--ink); border-radius:999px; padding:8px 14px; font-size:14px; }
.chip.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
.dots { display:flex; gap:5px; margin:10px 0 2px; }
.dots span { flex:1; height:12px; border-radius:6px; background:var(--soft); }
.dots span.on { background:var(--go); }
.stats { display:flex; gap:10px; }
.stat { flex:1; background:var(--soft); border-radius:14px; padding:12px; text-align:center; }
.stat b { display:block; font-size:26px; color:var(--accent); }
.stat small { color:var(--muted); font-size:12px; }
.bars { display:flex; align-items:flex-end; gap:8px; height:80px; margin-top:8px; }
.bars div { flex:1; background:var(--accent); border-radius:6px 6px 0 0; min-height:4px; opacity:.85; }
.bars small { display:block; text-align:center; font-size:11px; color:var(--muted); margin-top:4px; }
.note { border-left:5px solid var(--accent); background:var(--lav); border-radius:0 12px 12px 0; padding:12px 14px; font-size:14px; margin-bottom:14px; }
details { background:var(--surface); border:1px solid var(--line); border-radius:16px; margin-bottom:12px; }
summary { padding:14px 16px; font-weight:700; color:var(--dp); cursor:pointer; list-style:none; }
summary::-webkit-details-marker { display:none; }
summary::after { content:"+"; float:right; color:var(--accent); font-size:20px; line-height:1; }
details[open] summary::after { content:"\2212"; }
details > div { padding:0 16px 16px; }
.entry { border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--ww); }
.entry small { color:var(--muted); }
.entry p { margin:4px 0; font-size:15px; }
.scale label { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px; }
.scale .opts { display:flex; gap:14px; margin:6px 0 0; font-size:14px; color:var(--muted); }
.scale .opts label { border:0; padding:0; display:flex; gap:6px; }
.q { padding:10px 0; border-bottom:1px solid var(--line); }
.q p { margin:0 0 6px; font-size:15px; }
.saved { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom,0px)); background:var(--dp); color:#fff; padding:6px 14px; border-radius:999px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:20; }
.saved.show { opacity:.95; }
nav { position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--surface); border-top:1px solid var(--line); display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)); }
nav button { flex:1; background:none; border:0; padding:6px 2px; color:var(--muted); font-size:11px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:2px; }
nav button .ic { font-size:20px; line-height:1.1; }
nav button.on { color:var(--accent); }
nav button.on .ic { transform:translateY(-1px); }
.dnav { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.dnav .t { flex:1; text-align:center; font-weight:700; color:var(--dp); }
.dnav button { width:44px; height:44px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--accent); font-size:18px; }
input[type=range] { width:100%; accent-color:var(--accent); }
.out { width:100%; min-height:160px; font-size:12px; }
.hint { font-size:13px; color:var(--muted); }
</style>

<script>
(function () {
  var KEY = 'cbj_v1';
  var mem = null;
  function blank() {
    return { name: '', daily: {}, weekly: {}, log: [], scripts: [{}, {}, {}, {}], support: {}, check: {}, yn: { yes: '', maybe: '', no: '' }, values: [], extra: { safe: '', code: '' }, money: { income: {}, exp: [], goal: {} } };
  }
  var S;
  function load() {
    try { var r = window.localStorage.getItem(KEY); if (r) { var o = JSON.parse(r); var b = blank(); for (var k in b) if (!(k in o)) o[k] = b[k]; return o; } } catch (e) {}
    return blank();
  }
  var storageOK = true;
  function persist() {
    try { window.localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOK = false; }
  }
  var t1 = null, t2 = null;
  function saved() {
    clearTimeout(t1);
    t1 = setTimeout(function () {
      persist();
      var el = document.getElementById('saved');
      el.textContent = storageOK ? 'Saved on this phone' : 'Could not save \u2014 use Copy my entries';
      el.classList.add('show'); clearTimeout(t2); t2 = setTimeout(function () { el.classList.remove('show'); }, 1100);
    }, 350);
  }
  S = load();

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ds(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function pd(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = pd(s); d.setDate(d.getDate() + n); return ds(d); }
  function monday(s) { var d = pd(s); var w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return ds(d); }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function nice(s) { var d = pd(s); return DAY[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }
  var TODAY = ds(new Date());

  // path helpers: 'a|b|c'
  function getP(p) { var o = S; var k = p.split('|'); for (var i = 0; i < k.length; i++) { if (o == null) return undefined; o = o[k[i]]; } return o; }
  function setP(p, v) { var o = S; var k = p.split('|'); for (var i = 0; i < k.length - 1; i++) { if (o[k[i]] == null || typeof o[k[i]] !== 'object') o[k[i]] = {}; o = o[k[i]]; } o[k[k.length - 1]] = v; saved(); }

  var V = { tab: 'home', date: TODAY, week: monday(TODAY) };

  var PROT = ['My time', 'My values', 'My focus', 'A relationship \u2014 or myself in one', 'My rest'];
  var FEEL = ['Calm', 'Proud', 'Hopeful', 'Strong', 'Unsure', 'Tired', 'Anxious', 'Pressured'];
  var VALUES = ['Faith', 'Honesty', 'Family', 'Purpose', 'Respect', 'Integrity', 'Discipline', 'Peace', 'Friendship', 'Health', 'Learning', 'Kindness', 'Courage', 'Self-control', 'Excellence', 'Privacy', 'Rest', 'Service', 'Independence', 'Gratitude', 'Safety', 'Generosity', 'Humility', 'Growth'];
  var CHECKQ = ['I say no without long explanations or guilt.', 'I can name my top three values.', 'I protect my study and rest time.', 'I can leave a place or conversation that feels wrong.', 'I decide for myself before lending money, belongings or time.', 'I stop my phone from controlling my day.', 'I tell people what I need instead of hoping they guess.', 'I keep some things private until I trust someone.', 'I do not have to be available at every hour.', 'My friends respect it when I say no.', 'I know who to call when I feel unsafe or pressured.', 'I do not change my values to be accepted.'];
  var STYLES = [['The simple no', '\u201CNo, thank you.\u201D'], ['The delay', '\u201CLet me think about it and get back to you.\u201D'], ['The alternative', '\u201CI can\u2019t tonight, but I can on Saturday.\u201D'], ['The broken record', '\u201CI understand, and my answer is still no.\u201D'], ['The values line', '\u201CThat\u2019s just not something I do.\u201D'], ['The exit', '\u201CI\u2019m heading out now. Take care.\u201D']];
  var SUPPORT = ['Trusted adult', 'Close friend', 'Family member', 'Fellowship / faith leader', 'Campus counsellor', 'Campus security', 'Emergency contact'];

  function hasDaily(d) {
    var e = S.daily[d]; if (!e) return false;
    if (e.p && e.p.some(Boolean)) return true;
    return !!(e.focus || e.feel || e.held || e.struggled || e.tomorrow);
  }
  function streak() {
    var d = TODAY; if (!hasDaily(d)) d = addDays(d, -1);
    var n = 0; while (hasDaily(d)) { n++; d = addDays(d, -1); }
    return n;
  }
  function count(d) { var e = S.daily[d]; return e && e.p ? e.p.filter(Boolean).length : 0; }

  // ---------- views ----------
  function vHome() {
    var dots = '', bars = '', i, d;
    for (i = 13; i >= 0; i--) { d = addDays(TODAY, -i); dots += '<span class="' + (hasDaily(d) ? 'on' : '') + '" title="' + d + '"></span>'; }
    for (i = 6; i >= 0; i--) { d = addDays(TODAY, -i); var c = count(d); bars += '<div><div style="height:' + (c * 16 + 4) + 'px;background:var(--accent);border-radius:6px 6px 0 0"></div><small>' + DAY[pd(d).getDay()].charAt(0) + '</small></div>'; }
    var done = Object.keys(S.daily).filter(hasDaily).length;
    var wk = Object.keys(S.weekly).length;
    return '<div class="card"><h2>' + (S.name ? 'Welcome back, ' + esc(S.name) : 'Welcome') + '</h2>' +
      '<p class="sub">A private space to think, plan and practise. Everything you write stays on this phone \u2014 nobody can see it unless you choose to share it.</p>' +
      '<label class="f" for="nm">What should I call you? (optional)</label><input type="text" id="nm" data-p="name" value="' + esc(S.name) + '" placeholder="First name or nickname" autocomplete="off"></div>' +
      '<div class="card"><h2>Your progress</h2><div class="stats"><div class="stat"><b>' + streak() + '</b><small>day streak</small></div><div class="stat"><b>' + done + '</b><small>check-ins</small></div><div class="stat"><b>' + wk + '</b><small>weekly resets</small></div></div>' +
      '<h3>Last 14 days</h3><div class="dots">' + dots + '</div>' +
      '<h3>Boundaries protected \u2014 last 7 days</h3><div class="bars">' + bars + '</div></div>' +
      '<div class="card"><h2>Start here</h2><button class="btn" data-go="daily">Do today\u2019s check-in (2 min)</button><div style="height:8px"></div><button class="btn ghost" data-go="toolkit">Open my toolkit</button></div>' +
      '<div class="card"><h2>Keep or share my entries</h2><p class="sub">Your entries live only in this browser. If you clear your browser data or change phones, they are gone \u2014 so copy a backup now and then.</p>' +
      '<button class="btn ghost" id="exp">Copy my entries</button><textarea class="out" id="out" readonly hidden></textarea><p class="hint" id="exph"></p>' +
      '<div style="height:12px"></div><button class="btn danger" id="clr">Erase everything on this phone</button></div>' +
      '<p class="hint" style="text-align:center">Boundary Compass - version 3</p><div class="note">If something here brings up something heavy, talk to a trusted adult, a counsellor or a good friend. If you ever feel unsafe, tell someone right away.</div>';
  }

  function vDaily() {
    var d = V.date, e = S.daily[d] || {}, p = e.p || [], i, h = '';
    h += '<div class="dnav"><button data-d="-1" aria-label="Previous day">\u2039</button><div class="t">' + (d === TODAY ? 'Today \u00B7 ' : '') + nice(d) + '</div><button data-d="1" aria-label="Next day"' + (d >= TODAY ? ' disabled style="opacity:.35"' : '') + '>\u203A</button></div>';
    h += '<div class="card"><h2>Today I protected\u2026</h2>';
    for (i = 0; i < PROT.length; i++) h += '<label class="check"><input type="checkbox" data-pc="' + i + '"' + (p[i] ? ' checked' : '') + '><span>' + PROT[i] + '</span></label>';
    h += '<label class="f" for="fo">Today\u2019s boundary focus</label><textarea id="fo" data-p="daily|' + d + '|focus" placeholder="One boundary I want to keep today">' + esc(e.focus) + '</textarea>';
    h += '<label class="f">How I feel (one word)</label><div class="chips">';
    FEEL.forEach(function (w) { h += '<button class="chip' + (e.feel === w ? ' on' : '') + '" data-feel="' + w + '">' + w + '</button>'; });
    h += '</div>';
    h += '<label class="f" for="he">A moment I held a boundary</label><textarea id="he" data-p="daily|' + d + '|held">' + esc(e.held) + '</textarea>';
    h += '<label class="f" for="st">A moment I struggled</label><textarea id="st" data-p="daily|' + d + '|struggled">' + esc(e.struggled) + '</textarea>';
    h += '<label class="f" for="to">Tomorrow I will</label><textarea id="to" data-p="daily|' + d + '|tomorrow">' + esc(e.tomorrow) + '</textarea></div>';
    return h;
  }

  function vWeekly() {
    var w = V.week, e = S.weekly[w] || {}, k = 'weekly|' + w + '|', pr = e.pri || ['', '', ''];
    var h = '<div class="dnav"><button data-w="-7" aria-label="Previous week">\u2039</button><div class="t">Week of ' + nice(w) + '</div><button data-w="7" aria-label="Next week"' + (w >= monday(TODAY) ? ' disabled style="opacity:.35"' : '') + '>\u203A</button></div>';
    h += '<div class="card"><h2>Weekly reset</h2><p class="sub">About 15 minutes. Plan the week, then review it.</p><h3>My three priorities</h3>';
    for (var i = 0; i < 3; i++) h += '<input type="text" style="margin-bottom:8px" data-pri="' + i + '" value="' + esc(pr[i]) + '" placeholder="Priority ' + (i + 1) + '">';
    h += '<label class="f" for="w1">The boundary I am protecting this week</label><textarea id="w1" data-p="' + k + 'prot">' + esc(e.prot) + '</textarea>';
    h += '<label class="f" for="w2">What went well</label><textarea id="w2" data-p="' + k + 'well">' + esc(e.well) + '</textarea>';
    h += '<label class="f" for="w3">Where I slipped, and what I learned</label><textarea id="w3" data-p="' + k + 'slip">' + esc(e.slip) + '</textarea>';
    h += '<label class="f" for="w4">One thing I will adjust next week</label><textarea id="w4" data-p="' + k + 'adj">' + esc(e.adj) + '</textarea>';
    var st = e.str || 5;
    h += '<label class="f" for="w5">Boundary strength this week: <span id="sv">' + st + '</span> / 10</label><input type="range" id="w5" min="1" max="10" value="' + st + '" data-str="1"></div>';
    return h;
  }

  function vLog() {
    var h = '<div class="card"><h2>Add to my boundary log</h2><p class="sub">When you set (or struggled to set) a boundary, write it down. Look for patterns and wins.</p>' +
      '<label class="f" for="l1">Situation</label><textarea id="l1"></textarea>' +
      '<label class="f" for="l2">What I said or did</label><textarea id="l2"></textarea>' +
      '<label class="f" for="l3">How I felt</label><input type="text" id="l3">' +
      '<label class="f" for="l4">Next time I will</label><input type="text" id="l4">' +
      '<div style="height:12px"></div><button class="btn" id="ladd">Save this entry</button></div>';
    if (!S.log.length) h += '<p class="hint" style="text-align:center">No entries yet.</p>';
    S.log.slice().reverse().forEach(function (x) {
      h += '<div class="entry"><small>' + nice(x.date) + '</small>' +
        (x.situation ? '<p><b>Situation:</b> ' + esc(x.situation) + '</p>' : '') + (x.said ? '<p><b>I said/did:</b> ' + esc(x.said) + '</p>' : '') +
        (x.felt ? '<p><b>I felt:</b> ' + esc(x.felt) + '</p>' : '') + (x.next ? '<p><b>Next time:</b> ' + esc(x.next) + '</p>' : '') +
        '<button class="btn danger small" data-ldel="' + x.id + '" style="margin-top:6px">Delete</button></div>';
    });
    return h;
  }

  function vToolkit() {
    var h = '<div class="note"><b>If you ever feel unsafe</b>, you do not have to wait for proof or permission. Tell a trusted adult, a counsellor or campus security. Asking for help early is wisdom, not weakness.</div>';
    // self check
    h += '<details><summary>Boundary self-check</summary><div><p class="sub">Tick what fits you today. This is a starting point, not a test.</p>';
    CHECKQ.forEach(function (q, i) {
      var a = S.check[i];
      h += '<div class="q"><p>' + (i + 1) + '. ' + q + '</p><div class="opts" style="display:flex;gap:16px">' +
        ['Often', 'Sometimes', 'Rarely'].map(function (o) { return '<label style="display:flex;gap:6px;align-items:center"><input type="radio" name="c' + i + '" data-chk="' + i + '" value="' + o + '"' + (a === o ? ' checked' : '') + '>' + o + '</label>'; }).join('') + '</div></div>';
    });
    h += '<p id="csum" class="hint" style="margin-top:12px"></p></div></details>';
    // values
    h += '<details><summary>My values</summary><div><p class="sub">Tap up to three words that matter most to you.</p><div class="chips">';
    VALUES.forEach(function (v) { h += '<button class="chip' + (S.values.indexOf(v) > -1 ? ' on' : '') + '" data-val="' + v + '">' + v + '</button>'; });
    h += '</div><p id="vsum" class="hint" style="margin-top:10px"></p></div></details>';
    // yes maybe no
    h += '<details><summary>Yes, Maybe, No</summary><div><p class="sub">Decide in advance. A maybe always deserves time: \u201CLet me think about it and get back to you\u201D is a complete sentence.</p>' +
      '<label class="f" for="y1">YES \u2014 I am glad to</label><textarea id="y1" data-p="yn|yes">' + esc(S.yn.yes) + '</textarea>' +
      '<label class="f" for="y2">MAYBE \u2014 I need time or conditions</label><textarea id="y2" data-p="yn|maybe">' + esc(S.yn.maybe) + '</textarea>' +
      '<label class="f" for="y3">NO \u2014 I will not</label><textarea id="y3" data-p="yn|no">' + esc(S.yn.no) + '</textarea></div></details>';
    // saying no
    h += '<details><summary>Saying no, kindly</summary><div><p class="sub">You can be firm and respectful at the same time. You do not owe a long explanation.</p>';
    STYLES.forEach(function (s) { h += '<div class="entry"><b>' + s[0] + '</b><p><i>' + s[1] + '</i></p></div>'; });
    h += '</div></details>';
    // script cards
    h += '<details><summary>My script cards</summary><div><p class="sub">Words you have already practised come out more easily under pressure.</p>';
    for (var i = 0; i < 4; i++) {
      var c = S.scripts[i] || {};
      h += '<div class="entry"><b>Situation ' + (i + 1) + '</b>' +
        '<label class="f" for="s' + i + 'a">The situation</label><input type="text" id="s' + i + 'a" data-p="scripts|' + i + '|sit" value="' + esc(c.sit) + '">' +
        '<label class="f" for="s' + i + 'b">I will say</label><input type="text" id="s' + i + 'b" data-p="scripts|' + i + '|say" value="' + esc(c.say) + '">' +
        '<label class="f" for="s' + i + 'c">If they push</label><input type="text" id="s' + i + 'c" data-p="scripts|' + i + '|push" value="' + esc(c.push) + '">' +
        '<label class="f" for="s' + i + 'd">My exit plan</label><input type="text" id="s' + i + 'd" data-p="scripts|' + i + '|exit" value="' + esc(c.exit) + '"></div>';
    }
    h += '</div></details>';
    // support
    h += '<details><summary>My safety and support network</summary><div><p class="sub">Fill this in while you are calm. Leave blank anything you do not yet know.</p>';
    SUPPORT.forEach(function (w, i) {
      var s = S.support[i] || {};
      h += '<div class="entry"><b>' + w + '</b><div class="row" style="margin-top:6px"><input type="text" placeholder="Name" aria-label="' + w + ' name" data-p="support|' + i + '|name" value="' + esc(s.name) + '"><input type="tel" placeholder="Phone" aria-label="' + w + ' phone" data-p="support|' + i + '|tel" value="' + esc(s.tel) + '"></div></div>';
    });
    h += '<label class="f" for="x1">Safe places I can go on campus or near it</label><textarea id="x1" data-p="extra|safe">' + esc(S.extra.safe) + '</textarea>' +
      '<label class="f" for="x2">A code word or message I can send a friend if I need help</label><input type="text" id="x2" data-p="extra|code" value="' + esc(S.extra.code) + '"></div></details>';
    return h;
  }

  var MC = ['Needs', 'Wants', 'Saving', 'Giving'];
  var mcat = 'Needs';
  function mk(d) { return d.slice(0, 7); }
  function num(v) { var n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isNaN(n) ? 0 : n; }
  function naira(n) { return '\u20A6' + Math.round(n).toLocaleString('en-NG'); }
  function monthExp() { var m = mk(TODAY); return S.money.exp.filter(function (x) { return mk(x.date) === m; }); }
  function mSums() {
    var inc = num(S.money.income[mk(TODAY)]), sp = 0, by = {};
    MC.forEach(function (c) { by[c] = 0; });
    monthExp().forEach(function (x) { sp += num(x.amt); by[x.cat] = (by[x.cat] || 0) + num(x.amt); });
    return { inc: inc, sp: sp, left: inc - sp, by: by };
  }
  function catLine(s) { return MC.map(function (c) { return c + ' ' + naira(s.by[c] || 0); }).join('  |  '); }
  function updMoney() {
    var s = mSums(), g = S.money.goal || {}, e;
    if ((e = document.getElementById('m-in'))) e.textContent = naira(s.inc);
    if ((e = document.getElementById('m-sp'))) e.textContent = naira(s.sp);
    if ((e = document.getElementById('m-left'))) e.textContent = naira(s.left);
    if ((e = document.getElementById('m-bar'))) e.style.width = (s.inc > 0 ? Math.min(100, s.sp / s.inc * 100) : 0) + '%';
    if ((e = document.getElementById('m-cat'))) e.textContent = catLine(s);
    var t = num(g.target), v = num(g.saved), p = t > 0 ? Math.min(100, v / t * 100) : 0;
    if ((e = document.getElementById('m-gbar'))) e.style.width = p + '%';
    if ((e = document.getElementById('m-gtxt'))) e.textContent = t > 0 ? naira(v) + ' of ' + naira(t) + ' (' + Math.round(p) + '%)' : '';
  }
  function vMoney() {
    var m = mk(TODAY), s = mSums(), g = S.money.goal || {}, h = '';
    var t = num(g.target), v = num(g.saved), gp = t > 0 ? Math.min(100, v / t * 100) : 0;
    h += '<div class="card"><h2>' + MON[pd(TODAY).getMonth()] + ' ' + pd(TODAY).getFullYear() + '</h2>' +
      '<p class="sub">A simple monthly picture: what came in, where it went, what is left. General guidance only, not financial advice.</p>' +
      '<label class="f" for="mi">Money in this month (allowance, gifts, earnings)</label>' +
      '<input type="text" inputmode="decimal" id="mi" data-m="1" data-p="money|income|' + m + '" value="' + esc(S.money.income[m]) + '" placeholder="e.g. 30000">' +
      '<div class="stats" style="margin-top:12px"><div class="stat"><b id="m-in" style="font-size:18px">' + naira(s.inc) + '</b><small>in</small></div>' +
      '<div class="stat"><b id="m-sp" style="font-size:18px">' + naira(s.sp) + '</b><small>out</small></div>' +
      '<div class="stat"><b id="m-left" style="font-size:18px">' + naira(s.left) + '</b><small>left</small></div></div>' +
      '<div style="height:10px;background:var(--soft);border-radius:6px;margin-top:12px"><div id="m-bar" style="height:10px;border-radius:6px;background:var(--accent);width:' + (s.inc > 0 ? Math.min(100, s.sp / s.inc * 100) : 0) + '%"></div></div>' +
      '<p class="hint" id="m-cat" style="margin-top:8px">' + catLine(s) + '</p></div>';
    h += '<div class="card"><h2>Add spending</h2>' +
      '<div class="row"><input type="text" inputmode="decimal" id="ma" placeholder="Amount (\u20A6)" aria-label="Amount"><input type="text" id="mn" placeholder="What for?" aria-label="What for"></div>' +
      '<label class="f">Type</label><div class="chips" id="mchips">' +
      MC.map(function (c) { return '<button class="chip' + (mcat === c ? ' on' : '') + '" data-mcat="' + c + '">' + c + '</button>'; }).join('') + '</div>' +
      '<p class="hint" style="margin-top:8px"><b>Needs</b> = must-haves like food, transport, school. <b>Wants</b> = nice-to-haves. <b>Saving</b> = money set aside. <b>Giving</b> = tithes, gifts, helping others.</p>' +
      '<div style="height:10px"></div><button class="btn" id="madd">Add</button></div>';
    var items = monthExp().slice().reverse().slice(0, 10);
    if (items.length) {
      h += '<h3 style="margin:0 0 8px">Recent this month</h3>';
      items.forEach(function (x) {
        h += '<div class="entry"><small>' + nice(x.date) + ' - ' + x.cat + '</small><p><b>' + naira(num(x.amt)) + '</b>' + (x.note ? ' - ' + esc(x.note) : '') + '</p>' +
          '<button class="btn danger small" data-mdel="' + x.id + '">Delete</button></div>';
      });
    }
    h += '<div class="card" style="margin-top:14px"><h2>My savings goal</h2><p class="sub">Small, regular amounts beat big promises.</p>' +
      '<label class="f" for="gn">What am I saving for?</label><input type="text" id="gn" data-m="1" data-p="money|goal|name" value="' + esc(g.name) + '">' +
      '<div class="row"><div><label class="f" for="gt">Target (\u20A6)</label><input type="text" inputmode="decimal" id="gt" data-m="1" data-p="money|goal|target" value="' + esc(g.target) + '"></div>' +
      '<div><label class="f" for="gs">Saved so far (\u20A6)</label><input type="text" inputmode="decimal" id="gs" data-m="1" data-p="money|goal|saved" value="' + esc(g.saved) + '"></div></div>' +
      '<div style="height:10px;background:var(--soft);border-radius:6px;margin-top:14px"><div id="m-gbar" style="height:10px;border-radius:6px;background:var(--go);width:' + gp + '%"></div></div>' +
      '<p class="hint" id="m-gtxt" style="margin-top:6px">' + (t > 0 ? naira(v) + ' of ' + naira(t) + ' (' + Math.round(gp) + '%)' : '') + '</p></div>';
    h += '<details><summary>Pause before I spend</summary><div><p class="sub">Ask these five questions. If you are unsure, wait 24 hours.</p>' +
      '<div class="entry"><p>1. Is this a need or a want?</p><p>2. Will I still want it tomorrow?</p><p>3. Am I buying it because someone pressured me, or to impress people?</p><p>4. Can I pay without borrowing or using money meant for something else?</p><p>5. What am I giving up to buy this?</p></div></div></details>';
    h += '<details><summary>Money boundaries: what to say</summary><div>' +
      '<div class="entry"><b>Someone asks to borrow</b><p><i>\u201CI don\u2019t lend money, but I can help another way.\u201D</i></p></div>' +
      '<div class="entry"><b>Pressure to spend</b><p><i>\u201CThat\u2019s not in my budget this month.\u201D</i></p></div>' +
      '<div class="entry"><b>Not sure yet</b><p><i>\u201CLet me think about it and get back to you.\u201D</i></p></div>' +
      '<div class="entry"><b>Gifts or money with strings</b><p><i>\u201CThank you, but I\u2019d rather pay for myself.\u201D</i></p><p class="hint">If anyone expects something from you in return for money, gifts or favours, that is a warning sign. You can say no, leave, and tell a trusted adult.</p></div></div></details>';
    h += '<details><summary>Stay safe with money</summary><div>' +
      '<div class="entry"><p>\u2022 Never share your PIN, OTP, card details, password or BVN, even with someone who says they are from your bank.</p>' +
      '<p>\u2022 Be careful with \u201Cquick money\u201D offers, investment schemes promising big returns, and unknown loan apps.</p>' +
      '<p>\u2022 Do not send money to someone you cannot verify. Check that a transfer has really arrived before handing over goods.</p>' +
      '<p>\u2022 Keep a record of what you spend, so you notice anything strange early.</p>' +
      '<p>\u2022 If someone pressures or threatens you over money, tell a trusted adult.</p></div></div></details>';
    return h;
  }
  var TITLES = { home: 'Boundary Compass', daily: 'Daily check-in', weekly: 'Weekly reset', log: 'Boundary log', toolkit: 'My toolkit', money: 'Money compass' };
  var NAV = [['home', '\u2302', 'Home'], ['daily', '\u2713', 'Daily'], ['weekly', '\u25A6', 'Weekly'], ['log', '\u270E', 'Log'], ['toolkit', '\u2726', 'Toolkit'], ['money', '\u20A6', 'Money']];

  function render(keepScroll) {
    var y = window.scrollY;
    var v = { home: vHome, daily: vDaily, weekly: vWeekly, log: vLog, toolkit: vToolkit, money: vMoney }[V.tab];
    document.getElementById('main').innerHTML = v();
    document.getElementById('ttl').textContent = TITLES[V.tab];
    document.getElementById('nav').innerHTML = NAV.map(function (n) { return '<button data-tab="' + n[0] + '" class="' + (V.tab === n[0] ? 'on' : '') + '" aria-label="' + n[2] + '"><span class="ic">' + n[1] + '</span>' + n[2] + '</button>'; }).join('');
    if (V.tab === 'toolkit') { upCheck(); upVals(); }
    window.scrollTo(0, keepScroll ? y : 0);
  }
  function upCheck() {
    var el = document.getElementById('csum'); if (!el) return;
    var a = { Often: 0, Sometimes: 0, Rarely: 0 }, n = 0;
    Object.keys(S.check).forEach(function (k) { if (a[S.check[k]] != null) { a[S.check[k]]++; n++; } });
    el.textContent = n ? 'So far: ' + a.Often + ' often, ' + a.Sometimes + ' sometimes, ' + a.Rarely + ' rarely. Your \u201Crarely\u201D answers show where to build next.' : '';
  }
  function upVals() { var el = document.getElementById('vsum'); if (el) el.textContent = S.values.length ? 'My top values: ' + S.values.join(', ') : ''; }

  function exportText() {
    var o = ['BOUNDARY COMPASS \u2014 my entries', 'Copied on ' + nice(TODAY), ''];
    if (S.values.length) o.push('MY TOP VALUES: ' + S.values.join(', '), '');
    Object.keys(S.daily).sort().forEach(function (d) {
      var e = S.daily[d]; if (!hasDaily(d)) return;
      o.push('DAILY ' + d + ' | protected ' + count(d) + '/5' + (e.feel ? ' | feeling: ' + e.feel : ''));
      if (e.focus) o.push('  Focus: ' + e.focus); if (e.held) o.push('  Held: ' + e.held); if (e.struggled) o.push('  Struggled: ' + e.struggled); if (e.tomorrow) o.push('  Tomorrow: ' + e.tomorrow);
    });
    Object.keys(S.weekly).sort().forEach(function (w) {
      var e = S.weekly[w]; o.push('', 'WEEK OF ' + w + ' | strength ' + (e.str || '-') + '/10');
      (e.pri || []).forEach(function (p, i) { if (p) o.push('  Priority ' + (i + 1) + ': ' + p); });
      ['prot', 'well', 'slip', 'adj'].forEach(function (k) { if (e[k]) o.push('  ' + { prot: 'Protecting', well: 'Went well', slip: 'Slipped/learned', adj: 'Adjust' }[k] + ': ' + e[k]); });
    });
    if (S.log.length) { o.push('', 'BOUNDARY LOG'); S.log.forEach(function (x) { o.push(x.date + ' | ' + (x.situation || '') + ' | said/did: ' + (x.said || '') + ' | felt: ' + (x.felt || '') + ' | next: ' + (x.next || '')); }); }
    var M = S.money || {}; if (M.goal && M.goal.name) { o.push('', 'SAVINGS GOAL: ' + M.goal.name + ' | saved ' + (M.goal.saved || 0) + ' of ' + (M.goal.target || 0)); }
    (M.exp || []).forEach(function (x) { o.push('MONEY ' + x.date + ' | ' + x.cat + ' | ' + x.amt + ' | ' + (x.note || '')); });
    return o.join('\n');
  }

  // ---------- events ----------
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.dataset.p) setP(t.dataset.p, t.value);
    if (t.dataset.pri != null) { var k = 'weekly|' + V.week + '|pri'; var a = (getP(k) || ['', '', '']).slice(); a[+t.dataset.pri] = t.value; setP(k, a); }
    if (t.dataset.str) { document.getElementById('sv').textContent = t.value; setP('weekly|' + V.week + '|str', +t.value); }
    if (t.id === 'nm') { /* name saved via data-p */ }
    if (t.dataset.m) updMoney();
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.dataset.pc != null) { var k = 'daily|' + V.date + '|p'; var a = (getP(k) || [false, false, false, false, false]).slice(); a[+t.dataset.pc] = t.checked; setP(k, a); }
    if (t.dataset.chk != null) { setP('check|' + t.dataset.chk, t.value); upCheck(); }
  });
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button'); if (!t) return;
    var d = t.dataset;
    if (d.tab) { V.tab = d.tab; render(); return; }
    if (d.go) { V.tab = d.go; render(); return; }
    if (d.d && !t.disabled) { var nd = addDays(V.date, +d.d); if (nd <= TODAY) { V.date = nd; render(); } return; }
    if (d.w && !t.disabled) { var nw = addDays(V.week, +d.w); if (nw <= monday(TODAY)) { V.week = nw; render(); } return; }
    if (d.feel) { var cur = getP('daily|' + V.date + '|feel'); setP('daily|' + V.date + '|feel', cur === d.feel ? '' : d.feel); render(true); return; }
    if (d.val) {
      var i = S.values.indexOf(d.val);
      if (i > -1) S.values.splice(i, 1); else if (S.values.length < 3) S.values.push(d.val); else return;
      t.classList.toggle('on'); upVals(); saved(); return;
    }
    if (t.id === 'ladd') {
      var g = function (id) { return document.getElementById(id).value.trim(); };
      var x = { id: Date.now(), date: TODAY, situation: g('l1'), said: g('l2'), felt: g('l3'), next: g('l4') };
      if (!x.situation && !x.said && !x.felt && !x.next) return;
      S.log.push(x); saved(); render(); return;
    }
    if (d.ldel) { if (t.dataset.arm) { S.log = S.log.filter(function (z) { return String(z.id) !== d.ldel; }); saved(); render(true); } else { t.dataset.arm = '1'; t.textContent = 'Tap again to delete'; } return; }
    if (d.mcat) { mcat = d.mcat; var cs = document.querySelectorAll('#mchips .chip'); for (var q = 0; q < cs.length; q++) cs[q].classList.toggle('on', cs[q].dataset.mcat === mcat); return; }
    if (t.id === 'madd') { var amt = num(document.getElementById('ma').value); if (!amt) return; S.money.exp.push({ id: Date.now(), date: TODAY, cat: mcat, amt: amt, note: document.getElementById('mn').value.trim() }); saved(); render(true); return; }
    if (d.mdel) { if (t.dataset.arm) { S.money.exp = S.money.exp.filter(function (z) { return String(z.id) !== d.mdel; }); saved(); render(true); } else { t.dataset.arm = '1'; t.textContent = 'Tap again to delete'; } return; }
    if (t.id === 'exp') {
      var out = document.getElementById('out'), hint = document.getElementById('exph'); out.hidden = false; out.value = exportText(); out.focus(); out.select();
      var ok = false;
      try { ok = document.execCommand && document.execCommand('copy'); } catch (e) {}
      hint.textContent = ok ? 'Copied. Paste it into a note or send it to yourself on WhatsApp to keep a backup.' : 'Press and hold the text above, choose Select all, then Copy.';
      return;
    }
    if (t.id === 'clr') { if (t.dataset.arm) { S = blank(); persist(); render(); } else { t.dataset.arm = '1'; t.textContent = 'Tap again to erase everything \u2014 this cannot be undone'; } return; }
  });

  function refreshDay() {
    var n = ds(new Date());
    if (n !== TODAY) { var wasToday = V.date === TODAY, wasWeek = V.week === monday(TODAY); TODAY = n; if (wasToday) V.date = TODAY; if (wasWeek) V.week = monday(TODAY); render(true); }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshDay(); });
  window.addEventListener('focus', refreshDay);
  setInterval(refreshDay, 60000);

  render();
})();
</script>
</body>
